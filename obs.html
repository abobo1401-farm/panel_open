<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>4×4 パネル公開 OBS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="obs-body">
  <div class="obs-stage"><div id="board"></div></div>
  <script src="app.js"></script>
  <script>
  (async()=>{
    const PR=window.PanelReveal;
    const board=document.getElementById('board');
    const FLIP_MS=680;

    let state=PR.loadState();
    let redrawTimer=null;

    // 起動直後にwavのデコードとオーディオ出力の起動を済ませておく。
    // これをやらないと「1回目のSEだけ遅れる／頭が切れて聞こえづらい」現象が起きる。
    PR.primeAudio();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)PR.primeAudio()});

    // 開閉以外（モード・文字・画像）に変化があったかどうかの判定用
    function looksSig(s){
      return JSON.stringify([s.mode,s.labels,s.hasCover,s.hasOneBack,s.hasIndividual]);
    }

    function scheduleRedraw(delay){
      clearTimeout(redrawTimer);
      redrawTimer=setTimeout(()=>{draw();},delay);
    }

    async function draw(){
      clearTimeout(redrawTimer);
      await PR.renderBoard(board,state,{clickable:true,onClick:(i,tile)=>{
        if(state.opened[i]) return;
        // ★ SEはロックや再描画の完了を待たずに即座に鳴らす
        PR.playFlipSound(state.soundVolume);
        state.opened[i]=true;
        requestAnimationFrame(()=>tile.classList.add('opening'));
        PR.saveState(state);   // 管理画面側へ反映
      }});
    }

    // .opening のまま置いておけば .open と同じ最終形なので、
    // めくり後に再描画しなくてよい＝連打しても取りこぼしが出ない
    function flipTiles(indexes){
      let missed=0;
      indexes.forEach(i=>{
        const t=board.querySelector('.tile[data-index="'+i+'"]');
        if(t && !t.classList.contains('open')){
          requestAnimationFrame(()=>t.classList.add('opening'));
        }else{
          missed++;
        }
      });
      return missed;
    }

    await draw();

    PR.subscribeState(async(nextState,meta)=>{
      const newlyOpened=[];
      let closed=false;
      for(let i=0;i<PR.PANEL_COUNT;i++){
        if(!state.opened[i] && nextState.opened[i]) newlyOpened.push(i);
        if(state.opened[i] && !nextState.opened[i]) closed=true;
      }
      const otherChanged = looksSig(nextState)!==looksSig(state) || meta?.imagesChanged;

      // ★ 状態を先に確定させる。
      //   BroadcastChannelとstorageイベントの二重配信でも、
      //   2回目は newlyOpened が空になるのでSEは二度鳴らない。
      state=nextState;

      // ★ SEは何よりも先、無条件に鳴らす（アニメーションの成否と切り離す）
      if(newlyOpened.length) PR.playFlipSound(nextState.soundVolume);

      if(newlyOpened.length){
        const missed=flipTiles(newlyOpened);
        // 描画中などでタイルを掴めなかった分だけ、めくり終了後に描き直して整合させる
        if(missed || closed || otherChanged) scheduleRedraw(FLIP_MS+40);
      }else if(closed || otherChanged){
        await draw();
      }
    });
  })();
  </script>
</body>
</html>
