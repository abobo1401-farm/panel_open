<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4×4 パネル公開 OBS</title><link rel="stylesheet" href="style.css"></head><body class="obs-body"><div class="obs-stage"><div id="board"></div></div><script src="app.js"></script><script>
(async()=>{
 const PR=window.PanelReveal; let state=PR.loadState(); const board=document.getElementById('board'); let opening=false;
 async function draw(){await PR.renderBoard(board,state,{clickable:true,onClick:async(i,tile)=>{
   if(opening||state.opened[i])return; opening=true; PR.playFlipSound(state.soundVolume);
   tile.classList.add('open');
   setTimeout(async()=>{state.opened[i]=true;PR.saveState(state);await draw();opening=false;},610);
 }});}
 await draw();
 PR.subscribeState(async(s)=>{state=s;await draw();});
})();
</script></body></html>
